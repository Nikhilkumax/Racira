name: Visual QA sweep

# Full multi-viewport horizontal-overflow sweep across the CAD, Developers and
# PDF domains. Deliberately NOT in the local pre-push hook: against a production
# build it takes ~30-40 minutes, which would make every push painful. Static
# checks (tsc, dispatcher coverage, cad-reconcile) stay in pre-push; this job is
# the browser-based geometry gate.
#
# Local equivalent: npm run qa:visual   (or --quick for cad+pdf only)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: racira-nextjs/package-lock.json

      - name: Install dependencies
        working-directory: racira-nextjs
        run: npm ci

      - name: Install Playwright chromium
        working-directory: racira-nextjs
        run: npx playwright install --with-deps chromium

      - name: Static grid min-w-0 guard
        working-directory: racira-nextjs
        run: node _scripts/grid-min-w0-check.mjs

      # AdSense site verification lives entirely in /public/ads.txt. Nothing in
      # the app imports it, so only this guard notices if it is deleted or
      # reformatted. Mirrors the same check in .husky/pre-push.
      - name: AdSense verification guard
        working-directory: racira-nextjs
        run: node _scripts/adsense-verify-check.mjs

      - name: Run visual QA sweep (build → next start → scans)
        working-directory: racira-nextjs
        run: npm run qa:visual
